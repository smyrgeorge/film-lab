# The Film Lab PhotoCraft plug-ins: one WebAssembly module per plug-in, since an ABI v1 module is
# one manifest and one menu entry. Not a member of the repository workspace: everything here builds
# for wasm32-unknown-unknown only (no_std, no allocator, no imports), exactly like PhotoCraft's own
# `examples/plugins/invert-rs`, and `.cargo/config.toml` makes that the default target.
[workspace]
resolver = "3"
members = ["abi", "convert", "advanced"]

# One version for every module: the release tag matches it, and each manifest reports it.
[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
film-lab-core = { path = "../core" }
film-lab-photocraft = { path = "abi" }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Speed over size: the host interprets the module, so every instruction in the per-pixel loop
# costs time, and a module stays a few dozen kilobytes either way.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
